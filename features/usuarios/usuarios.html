<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios | MAG</title>

  <link rel="stylesheet" href="../../styles/style.css">
  <link rel="stylesheet" href="usuarios.css">
</head>
<body>

  <header class="header">
    <div class="header-logo">
      <img src="../../assets/images/logo-mag.jpg" alt="Logo MAG">
      <span>Restaurante MAG</span>
    </div>

    <nav class="nav-menu">
      <a href="../../index.html">Inicio</a>
      <a href="../clientes/clientes.html">Clientes</a>
      <a href="../pedidos/pedidos.html">Pedidos</a>
      <a href="../usuarios/usuarios.html">Usuarios</a>
      <button id="logout-btn">Cerrar sesión</button>
    </nav>
  </header>

  <main class="page-container">
    <h1 class="page-title">Usuarios del sistema</h1>
    <p class="page-subtitle">Módulo inicial para la gestión de usuarios autenticados.</p>

    <section class="usuarios-layout">
      <article class="usuario-card principal">
        <h2>Administrador</h2>
        <p>Usuario principal del sistema.</p>

        <div class="usuario-info">
          <span>Usuario</span>
          <strong>admin</strong>
        </div>

        <div class="usuario-info">
          <span>Rol</span>
          <strong>Administrador</strong>
        </div>

        <div class="usuario-info">
          <span>Estado</span>
          <strong class="estado activo">Activo</strong>
        </div>
      </article>

      <article class="usuario-card">
        <h2>Seguridad</h2>
        <p>El acceso al sistema se realiza mediante JWT.</p>
        <button id="btn-validar" class="btn-primary">Validar sesión</button>
        <p id="mensaje-sesion"></p>
      </article>
    </section>
  </main>

  <script src="usuarios.js"></script>
</body>
</html>
